[project]
name = "ai-sub"
version = "4.0.0"
authors = [
  { name = "FlippFuzz" },
]
description = "AI-Powered Subtitle Generation with Translation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pysubs2",
    "static-ffmpeg",
    "pydantic",
    "pydantic-settings",
    "google-genai",
    "logfire[google-genai, httpx]",
    "ddgs",
    "httpx",
    "json_repair",
    "pyrate-limiter",
    "rich",
    "pyyaml",
]

[project.urls]
"Homepage" = "https://github.com/FlippFuzz/ai-sub"
"Bug Tracker" = "https://github.com/FlippFuzz/ai-sub/issues"

[project.scripts]
ai-sub = "ai_sub.standalone:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
preview = true
select = ["D", "DOC", "E", "F", "I"]
fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"