[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sub"
dynamic = ["version"]
authors = [
  { name = "FlippFuzz" },
]
description = "AI-Powered Subtitle Generation with Translation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pysubs2",
    "static-ffmpeg",
    "pydantic",
    "pydantic-settings",
    "google-genai >= 3.0.0",
    "logfire[google-genai, httpx] >= 4.39.0",
    "opentelemetry-instrumentation-httpx >= 0.65b0",
    "ddgs",
    "httpx2",
    "json_repair",
    "pyrate-limiter >= 4.0.0",
    "rich",
    "pyyaml",
]

[project.optional-dependencies]
server = [
    "fastapi",
    "uvicorn",
    "yt-dlp[default]",
    "gitpython",
    "bgutil-ytdlp-pot-provider",
]
all = [
    "ai-sub[server]",
]

[project.urls]
"Homepage" = "https://github.com/FlippFuzz/ai-sub"
"Bug Tracker" = "https://github.com/FlippFuzz/ai-sub/issues"

[project.scripts]
ai-sub = "ai_sub.standalone:main"
ai-sub-server = "ai_sub.server.main:main"
ai-sub-worker = "ai_sub.worker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_sub.server" = ["static/*.html"]

[tool.setuptools_scm]
version_file = "src/ai_sub/_version.py"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
preview = true
select = ["D", "DOC", "E", "F", "I"]
fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
ignore = ["work/"]
